name: Auto-bump Patch Version

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version in CMakeLists.txt and Tag
        run: |
          CMAKE_FILE="CMakeLists.txt"

          if [ ! -f "$CMAKE_FILE" ]; then
            echo "Error: $CMAKE_FILE not found!"
            exit 1
          fi

          # Skip if PR already updated the VERSION line
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff "$BASE_SHA" "$HEAD_SHA" -- "$CMAKE_FILE" | grep -E '^\+[[:space:]]*VERSION[[:space:]]+[0-9]+' >/dev/null 2>&1; then
            echo "PR already touched VERSION in $CMAKE_FILE. Skipping automated bump."
            exit 0
          fi

          # Extract current version
          CURRENT_VERSION=$(grep -E '^[[:space:]]*VERSION[[:space:]]+[0-9]+' "$CMAKE_FILE" | head -n 1 | sed -E 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: Could not extract VERSION from $CMAKE_FILE"
            exit 1
          fi

          echo "Current version in $CMAKE_FILE: $CURRENT_VERSION"

          # Parse MAJOR.RELEASE.FIX
          IFS='.' read -r MAJOR RELEASE FIX <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-0}
          RELEASE=${RELEASE:-0}
          FIX=${FIX:-0}

          # Calculate bump
          NEW_FIX=$((FIX + 1))
          NEW_VERSION="${MAJOR}.${RELEASE}.${NEW_FIX}"
          NEW_TAG="v${NEW_VERSION}"

          echo "Bumping version: $CURRENT_VERSION -> $NEW_VERSION"

          # Replace in CMakeLists.txt
          sed -i -E "s/^([[:space:]]*VERSION[[:space:]]+)[0-9]+\.[0-9]+(\.[0-9]+)?/\1${NEW_VERSION}/" "$CMAKE_FILE"

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit, tag, and push dynamically to whichever branch was the PR target
          TARGET_BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          git add "$CMAKE_FILE"
          git commit -m "chore: bump version to $NEW_TAG [skip ci]"
          git tag -a "$NEW_TAG" -m "Automated patch bump to $NEW_TAG"

          git push origin "HEAD:${TARGET_BRANCH}" --follow-tags